# ── Prefix ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix `
bind ` send-prefix

unbind r
bind q source-file ~/.tmux.conf

# ── Panes ─────────────────────────────────────────────────────────────
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

bind -r j resize-pane -D 3
bind -r k resize-pane -U 3
bind -r h resize-pane -L 3
bind -r l resize-pane -R 3
bind -r m resize-pane -Z

bind -r o split-window -h "nvim ~/mantu/Obsidian/Journal/$(date +'%Y-%m-%d').md"
bind -r v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# ── Windows ───────────────────────────────────────────────────────────
bind c new-window -c '#{pane_current_path}'
bind r command-prompt -I "#W" "rename-window -- '%%'"

# ── Sessions ──────────────────────────────────────────────────────────
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind P switch-client -p
bind N switch-client -n
bind f display-popup -E "~/.local/bin/tms"   # fzf session picker over ~/mantu
bind 0 run-shell "tmux has-session -t=mantu 2>/dev/null || tmux new-session -ds mantu -c ~/mantu; tmux switch-client -t mantu"

# ── Copy mode (vi) ────────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ── Options ───────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g renumber-windows on       # renumber all windows when any window is closed
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g repeat-time 1000
set -g history-limit 10000
set -g set-clipboard on          # use system clipboard
set -gq allow-passthrough on     # let images / OSC sequences through
set -g visual-activity off
set -g default-terminal "tmux-256color"
set -gs terminal-overrides ',*:RGB'

# ── Plugins ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @catppuccin_flavor "mocha"
set -g @yank_selection 'clipboard'

# ── Status bar ────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 0
set -g status-left-length 100
set -g status-left '#[fg=colour255,bg=colour60,bold] #S '
set -g status-right ""

# Window list
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text "#W "
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# ── TPM ──────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'

# Transparent status bar — must come after tpm, catppuccin sets its own bg
set -g status-bg default
set -g status-style bg=default
set -g popup-style bg=default
